<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1712" />
    <meta name="description" content="Tower defense game built with TypeScript and PixiJS" />
    <link rel="icon" href="data:," />
    <title>Tower Defense</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1712; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; }
      #app { position: fixed; inset: 0; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #cfe3c6; font: 600 18px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
